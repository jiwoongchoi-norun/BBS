services:
  app:
    build: .
    image: bbs-app:local
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: development
      SESSION_SECRET: bbs-compose-session-secret-change-me
      DATABASE_URL: postgres://bbs:bbs_dev_password@postgres:5432/bbs
      PG_TIMEZONE: Asia/Seoul
      AUTH_RATE_LIMIT: 20
      WRITE_RATE_LIMIT: 120
      SEED_PASSWORD: Password123!
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/bbs/list'').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bbs
      POSTGRES_USER: bbs
      POSTGRES_PASSWORD: bbs_dev_password
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bbs -d bbs']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  uploads-data:
