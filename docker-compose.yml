services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bbs
      POSTGRES_USER: bbs
      POSTGRES_PASSWORD: bbs_dev_password
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bbs -d bbs']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
