name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 3010
      HOST: 127.0.0.1
      NODE_ENV: test
      SESSION_SECRET: release-session-secret
      DATABASE_URL: postgres://bbs:bbs_dev_password@127.0.0.1:5432/bbs
      PG_TIMEZONE: Asia/Seoul
      AUTH_RATE_LIMIT: 100
      WRITE_RATE_LIMIT: 300
      SEED_PASSWORD: Password123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify app loads
        run: npm run verify:app

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm run audit

      - name: UI smoke tests
        run: npm run ui:check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          {
            echo "name=$IMAGE_NAME"
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$IMAGE_NAME:latest"
            echo "$IMAGE_NAME:$VERSION"
            echo "$IMAGE_NAME:$MAJOR"
            echo "$IMAGE_NAME:$MAJOR.$MINOR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Docker image:

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ```

            Docker Compose:

            ```bash
            docker compose up --build
            ```
